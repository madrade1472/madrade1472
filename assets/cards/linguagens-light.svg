<svg xmlns="http://www.w3.org/2000/svg" width="410" height="210" viewBox="0 0 410 210" role="img" aria-label="Linguagens mais usadas">
<title>Linguagens mais usadas</title>
<style>
  .t{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;fill:#1f2328}
  .s{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;fill:#59636e}
  .m{font-family:'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace}
  .entra{opacity:0;animation:entra .7s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.entra,.cresce,.barra{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#8250df"/>
  </linearGradient>
</defs>
<rect x=".5" y=".5" width="409" height="209" rx="14" fill="#ffffff" stroke="#d0d7de"/>

<text x="24" y="40" class="s m entra" font-size="12" letter-spacing="2">LINGUAGENS MAIS USADAS</text>
<clipPath id="c"><rect x="24" y="62" width="362" height="10" rx="5"/></clipPath>
<g clip-path="url(#c)"><g class="barra" style="transform-origin:24px 0;animation:cresce 1.1s cubic-bezier(.2,.7,.2,1) forwards;transform:scaleX(0)"><rect x="24.0" y="62" width="247.2" height="10" fill="#3572A5"><title>Python</title></rect><rect x="271.2" y="62" width="61.6" height="10" fill="#f1e05a"><title>JavaScript</title></rect><rect x="332.8" y="62" width="42.6" height="10" fill="#e34c26"><title>HTML</title></rect><rect x="375.3" y="62" width="4.3" height="10" fill="#012456"><title>PowerShell</title></rect><rect x="379.6" y="62" width="3.5" height="10" fill="#663399"><title>CSS</title></rect><rect x="383.1" y="62" width="1.5" height="10" fill="#384d54"><title>Dockerfile</title></rect><rect x="384.4" y="62" width="1.5" height="10" fill="#89e051"><title>Shell</title></rect><rect x="385.6" y="62" width="1.5" height="10" fill="#59636e"><title>Outras</title></rect></g></g>
<style>@keyframes cresce{to{transform:scaleX(1)}}</style>
<g class="entra" style="animation-delay:0.20s">
  <circle cx="29" cy="100" r="5" fill="#3572A5"/>
  <text x="41" y="104" class="t" font-size="13">Python</text>
