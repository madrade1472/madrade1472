  <text x="41" y="130" class="t" font-size="13">HTML</text>
  <text x="194" y="130" class="s m" font-size="11.5" text-anchor="end">11.8%</text>
</g><g class="entra" style="animation-delay:0.38s">
  <circle cx="214" cy="126" r="5" fill="#012456"/>
  <text x="226" y="130" class="t" font-size="13">PowerShell</text>
