  </linearGradient>
</defs>
<rect x=".5" y=".5" width="409" height="209" rx="14" fill="#0d1117" stroke="#21262d"/>

<text x="24" y="40" class="s m entra" font-size="12" letter-spacing="2">LINGUAGENS MAIS USADAS</text>
<clipPath id="c"><rect x="24" y="62" width="362" height="10" rx="5"/></clipPath>
<g clip-path="url(#c)"><g class="barra" style="transform-origin:24px 0;animation:cresce 1.1s cubic-bezier(.2,.7,.2,1) forwards;transform:scaleX(0)"><rect x="24.0" y="62" width="299.8" height="10" fill="#3572A5"><title>Python</title></rect><rect x="323.8" y="62" width="26.5" height="10" fill="#f1e05a"><title>JavaScript</title></rect><rect x="350.4" y="62" width="12.4" height="10" fill="#3178c6"><title>TypeScript</title></rect><rect x="362.8" y="62" width="4.4" height="10" fill="#e34c26"><title>HTML</title></rect><rect x="367.2" y="62" width="4.3" height="10" fill="#4F5D95"><title>PHP</title></rect><rect x="371.5" y="62" width="4.3" height="10" fill="#663399"><title>CSS</title></rect><rect x="375.8" y="62" width="2.7" height="10" fill="#00ADD8"><title>Go Template</title></rect><rect x="378.5" y="62" width="7.5" height="10" fill="#8b949e"><title>Outras</title></rect></g></g>
<style>@keyframes cresce{to{transform:scaleX(1)}}</style>
